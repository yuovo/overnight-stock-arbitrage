function liveNumber(value, fallback = 0) {
  const number = Number(value);
  return Number.isFinite(number) ? number : fallback;
}

function liveSigned(value, digits = 2) {
  const number = liveNumber(value);
  return `${number >= 0 ? "+" : ""}${number.toFixed(digits)}`;
}

function liveFixed(value, digits = 2) {
  return liveNumber(value).toFixed(digits);
}

function liveFlow(value) {
  const number = liveNumber(value);
  const sign = number >= 0 ? "+" : "-";
  const absolute = Math.abs(number);
  if (absolute >= 100000000) return `${sign}${(absolute / 100000000).toFixed(1)}亿`;
  if (absolute >= 10000) return `${sign}${(absolute / 10000).toFixed(1)}万`;
  return `${sign}${absolute.toFixed(0)}`;
}

function liveShanghaiParts(epochMs = Date.now()) {
  return Object.fromEntries(
    new Intl.DateTimeFormat("zh-CN", {
      timeZone: "Asia/Shanghai",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      weekday: "short",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hourCycle: "h23"
    }).formatToParts(new Date(epochMs)).filter(part => part.type !== "literal").map(part => [part.type, part.value])
  );
}

function liveDateLabels(epochSeconds) {
  if (!epochSeconds) return { date: "正在连接实时行情", time: "--:--:--", clock: "--:--" };
  const parts = liveShanghaiParts(liveNumber(epochSeconds) * 1000);
  return {
    date: `${parts.year}.${parts.month}.${parts.day} ${parts.weekday}`,
    time: `${parts.hour}:${parts.minute}:${parts.second}`,
    clock: `${parts.hour}:${parts.minute}`
  };
}

function liveMarketOpen(now = Date.now(), quoteEpoch = liveState.quoteEpoch) {
  const nowParts = liveShanghaiParts(now);
  const quoteParts = quoteEpoch ? liveShanghaiParts(quoteEpoch * 1000) : null;
  const sameDay = quoteParts && nowParts.year === quoteParts.year && nowParts.month === quoteParts.month && nowParts.day === quoteParts.day;
  const weekday = Number(nowParts.weekday.replace("周", "").replace("星期", "").replace("，", "").replace("日", "7").replace("一", "1").replace("二", "2").replace("三", "3").replace("四", "4").replace("五", "5").replace("六", "6"));
  const minutes = Number(nowParts.hour) * 60 + Number(nowParts.minute);
  const tradingTime = (minutes >= 570 && minutes <= 705) || (minutes >= 780 && minutes <= 910);
  return Boolean(sameDay && weekday >= 1 && weekday <= 5 && tradingTime);
}

async function liveJson(url, timeout = 10000) {

  try {
    const response = await fetch(url, { cache: "no-store", signal: controller.signal });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return await response.json();
  } finally {
    clearTimeout(timer);
  }
}

    const turnover = liveNumber(quote.f8);
    const floatCap = liveNumber(quote.f21) / 100000000;
    const limitUps20d = liveState.history.get(item.code) ?? 0;
    const previousClose = price / (1 + change / 100);
    const minute = liveState.minute.get(item.code);
    const vwap = minute?.last ? minute.last.price >= minute.last.average : false;
    const isTwentyPercentBoard = /^(300|301|688)/.test(item.code);

  const result = [];
  for (let index = 0; index < count; index += 1) {
    result.push(values[Math.round(index * (values.length - 1) / (count - 1))]);
  }
  return result;
}

  const focusSecids = [...new Set([selectedCode, ...liveState.pinnedCodes].filter(Boolean))].map(liveSecid);
  const indexSecids = LIVE_INDICES.map(item => item.secid);

    if (quoteResult.status !== "fulfilled") throw quoteResult.reason;
    if (marketResult.status !== "fulfilled") throw marketResult.reason;
    liveApplyQuotes(quoteResult.value, marketResult.value.rows, marketResult.value.total);
    if (sectorResult.status === "fulfilled") liveApplySectors(sectorResult.value);
    await liveRefreshHistory(forceHistory);

    liveState.error = error?.name === "AbortError" ? "行情请求超时" : "行情连接失败";
    liveState.lastUpdated = "连接失败";
    liveState.version += 1;
    return { ok: false, isMarketOpen: false, error: liveState.error };
  } finally {
    liveState.refreshing = false;
  }
}
